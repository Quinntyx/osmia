[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osmia"
version = "0.1.0"
description = "A minimal Python agent harness with a credential-owning OpenAI-compatible proxy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Osmia" }]
dependencies = [
  "httpx>=0.27",
  "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
osmia = "osmia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osmia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
